name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.17.0

      - name: Run ruff
        run: ruff check .

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action lists a PR's commits via the API
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: SAST scan (bandit)
        run: bandit -r backend/ services/ -x backend/tests/ -ll

      - name: Dependency CVE scan (pip-audit)
        run: |
          pip-audit -r backend/requirements.txt
          pip-audit -r requirements.txt

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint, security]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: activesg_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-test.txt

      - name: Apply migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/activesg_test_db
        run: alembic upgrade head

      - name: Check models match migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/activesg_test_db
        run: alembic check

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://user:password@localhost:5432/activesg_test_db
          DATABASE_URL: postgresql://user:password@localhost:5432/activesg_test_db
        run: pytest -v --cov --cov-report=term-missing --cov-fail-under=85
